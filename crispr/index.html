const COMP = {A:'T',C:'G',G:'C',T:'A',N:'N'};
const rc = s => s.toUpperCase().split('').reverse().map(c => COMP[c] || 'N').join('');
const CODON = {};(function(){const b='TCAG',aa='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';let k=0;for(const x of b)for(const y of b)for(const z of b)CODON[x+y+z]=aa[k++];})();

const tmOf = s => s.length < 14 ? 2*(s.split('').filter(c=>c==='A'||c==='T').length)+4*(s.split('').filter(c=>c==='G'||c==='C').length)
                              : Math.round((64.9 + 41*(s.split('').filter(c=>c==='G'||c==='C').length - 16.4)/s.length)*10)/10;
function findAll(hay, needle){ const o=[]; let i=hay.indexOf(needle); while(i>=0){o.push(i); i=hay.indexOf(needle,i+1);} return o; }

/* =====================================================================
   CRISPR LOGIC  (all coordinates 0-based; "boundary b" = between base b-1 and base b)
   ===================================================================== */
const INS = STOP_START;                         // insertion boundary: right in front of the stop codon
function pamAt(s){                               // classify the 3-mer WT[s..s+3) as PAM on + strand (NGG) or - strand (CCN)
  const w = WT.slice(s, s+3);
  if (w.length === 3 && w[1]==='G' && w[2]==='G') return '+';
  if (w.length === 3 && w[0]==='C' && w[1]==='C') return '-';
  return null;
}
function pamInfo(s, strand){
  if (strand === '+'){ const p0 = s-20; return {s, strand, pam:WT.slice(s,s+3), proto:[p0,s], guide:WT.slice(p0,s), cut:s-3}; }
  const p0 = s+3;     return {s, strand, pam:rc(WT.slice(s,s+3)), proto:[p0,p0+20], guide:rc(WT.slice(p0,p0+20)), cut:s+6};
}
function candidatePams(maxDist){
  const out=[];
  for (let s=INS-80; s<INS+80; s++){ const st=pamAt(s); if(!st) continue; const pi=pamInfo(s,st); const d=Math.abs(pi.cut-INS); if(d<=maxDist) out.push(Object.assign(pi,{dist:d})); }
  return out.sort((a,b)=>a.dist-b.dist);
}
const BEST = candidatePams(1000)[0];
function pamSpansInsertion(pi){ return pi.s < INS && pi.s+3 > INS; }
function applyMut(seq, mut){ return mut ? seq.slice(0,mut.pos)+mut.base+seq.slice(mut.pos+1) : seq; }
function pamBroken(pi, mut){                     // is the PAM destroyed in the edited genome?
  if (pamSpansInsertion(pi)) return true;
  const w = applyMut(WT, mut).slice(pi.s, pi.s+3);
  return pi.strand==='+' ? !(w[1]==='G'&&w[2]==='G') : !(w[0]==='C'&&w[1]==='C');
}
function aaEffect(pos, base){                    // effect of changing WT base 'pos' on the C-terminal protein
  if (pos < INS){
    const cs = INS - 3*Math.ceil((INS-pos)/3);
    const wtc = WT.slice(cs,cs+3), nc = wtc.slice(0,pos-cs)+base+wtc.slice(pos-cs+1);
    return {where:'coding', wtc, nc, wtaa:CODON[wtc], naa:CODON[nc], same: CODON[wtc]===CODON[nc]};
  }
  if (pos < INS+3){
    const wtc = WT.slice(INS,INS+3), nc = wtc.slice(0,pos-INS)+base+wtc.slice(pos-INS+1);
    return {where:'stop', wtc, nc, wtaa:'*', naa:CODON[nc], same: CODON[nc]==='*'};
  }
  return {where:'utr', same:true};
}
function buildTemplate(L1, L2, mut){
  const wm = applyMut(WT, mut);
  return {hr1: wm.slice(INS-L1, INS), gfp: GFP, hr2: wm.slice(INS, INS+L2)};
}
function editedGenome(mut){ const wm = applyMut(WT, mut); return wm.slice(0,INS) + GFP + wm.slice(INS); }
function pcr(templates, f, r, maxLen){            // in-silico PCR: returns list of product sizes for primer f (fwd) and r (rev)
  const out=[]; const rr = rc(r);
  for (const t of templates){
    const fs = findAll(t, f), rs = findAll(t, rr);
    for (const a of fs) for (const b of rs){ const len = b + r.length - a; if (b >= a && len <= maxLen) out.push(len); }
  }
  return out;
}

function colorOf(cls){ return getComputedStyle(document.documentElement).getPropertyValue(cls).trim(); }
/* opts: seq, segs:[[from,to],...], marks:[{from,to,track:'fill'|'u1'|'u2'|'u3',color:'--c-x'}], bnds:[{at,color,dash}], mode:'base'|'bnd'|null, onPick(i) */
function renderViewer(el, o){
  el.onmousemove = el.onmouseleave = el.onclick = null;
  const wAvail = Math.max(300, el.clientWidth - 90);
  const perRow = Math.max(30, Math.min(60, Math.floor(wAvail / 9 / 10 / 1.1) * 10));
  const n = o.seq.length, fill = new Array(n), ul = {u1:new Array(n), u2:new Array(n), u3:new Array(n)}, bd = {}, lb = {};
  for (const m of (o.marks||[])) for (let i=Math.max(0,m.from); i<Math.min(n,m.to); i++){ if (m.track==='fill') fill[i]=m.color; else ul[m.track][i]=m.color; }
  for (const b of (o.bnds||[])) bd[b.at] = b;
  for (const l of (o.labels||[])) lb[l.at] = l;
  const tok = o.tok || null;
  let html = '';
  (o.segs||[[0,n]]).forEach((seg, si) => {
    if (si>0){ const prev = o.segs[si-1][1], gap = seg[0]-prev; html += `<div class="gapbar">⋯ ${gap} bp not shown (${o.gapLabel||'insert'}) ⋯</div>`; }
    for (let a=seg[0]; a<seg[1]; a+=perRow){
      const e = Math.min(seg[1], a+perRow); let l1='', l2='', hasl=false;
      for (let i=a;i<e;i++){
        if (tok && tok.pos===i){ l1 += `<span class="tok" data-i="${i-0.5}" data-tok="${esc(tok.text)}">${esc(tok.text)}</span>`; l2 += `<span class="tok" style="visibility:hidden">${esc(tok.text)}</span>`; }
        const ch = o.seq[i], c2 = COMP[ch]||'N';
        const sh = []; if (ul.u1[i]) sh.push(`inset 0 -2px 0 ${colorOf(ul.u1[i])}`); if (ul.u2[i]) sh.push(`inset 0 -5px 0 ${colorOf(ul.u2[i])}`); if (ul.u3[i]) sh.push(`inset 0 -8px 0 ${colorOf(ul.u3[i])}`);
        const st = (fill[i]?`background:${colorOf(fill[i])};`:'') + (sh.length?`box-shadow:${sh.join(',')};`:'') + (bd[i]?`--bc:${colorOf(bd[i].color)};`:'');
        const cls = 'b' + (((i-a)%10===9 && i<e-1)?' g':'') + (bd[i]?' bnd'+(bd[i].dash?' dash':''):'');
        const lab = lb[i] ? `<span class="lbl" style="color:${colorOf(lb[i].color||'--c-ins')}">${esc(lb[i].text)}</span>` : ''; if (lab) hasl = true;
        l1 += `<span class="${cls}" data-i="${i}" style="${st}">${lab}${ch}</span>`;
        l2 += `<span class="${cls.replace(' bnd','').replace(' dash','')}" style="${fill[i]?`background:${colorOf(fill[i])};`:''}">${c2}</span>`;
      }
      html += `<div class="vrow${hasl?' hasl':''}"><div class="vlab">${a+1}</div><div class="vseq mode-${o.mode||'none'}"><div class="l1">${l1}</div><div class="l2">${l2}</div></div></div>`;
    }
  });
  el.innerHTML = html;
  if (!o.mode) return;
  let last = null;
  const clear = () => { el.querySelectorAll('.hov').forEach(x=>x.classList.remove('hov')); el.querySelectorAll('.bnd-hov').forEach(x=>x.classList.remove('bnd-hov')); };
  const pick = ev => { const t = ev.target.closest('.l1 .b'); if (!t) return null; const i = +t.dataset.i; if (o.mode==='bnd'){ const r=t.getBoundingClientRect(); return (ev.clientX < r.left + r.width/2) ? i : i+1; } return i; };
  el.onmousemove = ev => { const p = pick(ev); if (p===last) return; last=p; clear(); if (p==null) return;
    if (o.mode==='base'){ for (let k=0;k<3;k++){ const x = el.querySelector(`.l1 .b[data-i="${p+k}"]`); if (x) x.classList.add('hov'); } }
    else { const x = el.querySelector(`.l1 .b[data-i="${p}"]`); if (x) x.classList.add('bnd-hov'); } };
  el.onmouseleave = () => { clear(); last=null; };
  el.onclick = ev => { const p = pick(ev); if (p!=null && o.onPick) o.onPick(p); };
}
/* ---- selection and copy tools (forward / reverse complement) ---- */
let COPYMODE = false;
function selInfo(){
  const sel = window.getSelection(); if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0), found = [];
  for (const id of ['viewer','viewer2']){
    const root = $(id); if (!root.offsetParent) continue;
    const items = [...root.querySelectorAll('.l1 .b, .l1 .tok')].filter(el => r.intersectsNode(el));
    if (items.length) found.push([id, items]);
  }
  if (!found.length) return null;
  if (found.length > 1) return {seq:'', ok:false, n:0, root:'both'};
  const [id, items] = found[0]; let seq = '', ok = true, prev = null, n = 0;
  for (const el of items){ const i = +el.dataset.i; if (prev!=null && i-prev>1) ok = false; prev = i;
    if (el.classList.contains('tok')) seq += el.dataset.tok; else { const l = el.querySelector('.lbl'); seq += l ? el.textContent.replace(l.textContent,'') : el.textContent; n++; } }
  return {seq, ok, n, root:id};
}
function updateSel(){
  if (!COPYMODE) return; const s = selInfo();
  $('selinfo').textContent = !s ? 'nothing selected' : (s.ok ? `${s.n} nt selected` : 'selection includes a hidden part: select inside one visible block');
}
function writeClip(t){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); };
  try { navigator.clipboard.writeText(t).catch(fallback); } catch(e){ fallback(); }
}
function doCopy(kind){
  const s = selInfo(), box = $('copymsg');
  if (!s){ box.style.color='var(--bad)'; box.textContent = 'Select a range in the upper sequence first (drag with the mouse).'; return; }
  if (!s.ok){ box.style.color='var(--bad)'; box.textContent = 'Your selection includes a hidden part of the sequence. Select only inside one visible block.'; return; }
  let t = s.seq; if (kind==='r'){ if (/[^ACGT]/.test(t)){ box.style.color='var(--bad)'; box.textContent='The reverse complement only works for plain DNA; do not include the <EGFP> label.'; return; } t = rc(t); }
  writeClip(t); box.style.color='var(--ok)';
  box.textContent = `Copied ${kind==='r'?'reverse complement':'forward'} (${t.replace(/[^ACGT]/g,'').length} nt): ` + (t.length>70 ? t.slice(0,32)+' … '+t.slice(-32) : t) + '  → now paste (Ctrl+V) into the box below.';
}
function legend(items){ $('legend').innerHTML = items.map(([c,t,k]) => `<span><i style="background:var(${c})${k==='line'?';height:3px':''}"></i>${t}</span>`).join(''); }

function wtView(extra){
  const marks=[{from:INS,to:INS+3,track:'fill',color:'--c-stop'}], bnds=[], leg=[['--c-stop','stop codon (TAA)']];
  if (S.ins != null){ bnds.push({at:S.ins, color:'--c-ins'}); leg.push(['--c-ins','insertion site','line']); }
  if (S.pam){ marks.push({from:S.pam.s, to:S.pam.s+3, track:'fill', color:'--c-pam'}); leg.push(['--c-pam','PAM']); }
  if (S.guide){ marks.push({from:S.pam.proto[0], to:S.pam.proto[1], track:'u1', color:'--c-guide'}); leg.push(['--c-guide','guide RNA target (protospacer)']); }
  if (S.cut != null){ bnds.push({at:S.cut, color:'--c-cut', dash:true}); leg.push(['--c-cut','Cas9 cut','line']); }
  if (extra && extra.marks) marks.push(...extra.marks);
  return {seq:WT, segs:[(extra && extra.seg) || [INS-200, INS+200]], marks, bnds, leg, labels:[{at:INS, text:'STOP', color:'--c-ins'}]};
}
function editedView(){
  const seq = editedGenome(S.mut), marks=[{from:INS,to:INS+GFP.length,track:'fill',color:'--c-gfp'}], bnds=[], leg=[['--c-gfp','EGFP insert']];
  if (S.pam){ const s = S.pam.s + (S.pam.s >= INS ? GFP.length : 0); if(!pamSpansInsertion(S.pam)){ marks.push({from:s,to:s+3,track:'fill',color:'--c-pam'}); leg.push(['--c-pam','PAM']); } }
  if (S.mut){ const p = S.mut.pos + (S.mut.pos >= INS ? GFP.length : 0); marks.push({from:p,to:p+1,track:'fill',color:'--c-mut'}); leg.push(['--c-mut','mutated base']); }

const KIND_TXT = {egfp:'inside EGFP', left:'genomic, upstream of HR1 (outside the arm)', right:'genomic, downstream of HR2 (outside the arm)'};
function genoCheck(){

function solGeno(){

  <ul><li><b>two primers flanking</b> the insertion site, i.e. one upstream and one downstream of it, both <b>outside the homology arms</b>,</li><li><b>one primer inside GFP</b>.</li></ul>
  <p>Why outside the arms? Leftover repair template or extrachromosomal copies contain the arms and would give a product with a primer lying inside them. The two flanking primers amplify the wild-type locus; the GFP primer pairs with one of them to amplify <b>only</b> the modified locus. <b>The modified-specific product must appear only when GFP is correctly inserted: the original DNA must not give it, nor any other (shorter or longer) product.</b></p>

function drawGel(){
