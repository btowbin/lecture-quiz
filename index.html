<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Systems Biology Quiz</title>
<meta name="description" content="Exam-style multiple-choice questions for the Systems Biology lecture: self-test or live in the lecture.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e99'/%3E%3Cpath d='M8 44 C20 44 20 18 32 18 S44 44 56 44' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#14202b; --muted:#5b6b7a; --line:#dde3e9;
  --accent:#0b6e99; --accent-ink:#ffffff; --accent-soft:#e3f1f7;
  --ok:#17874f; --ok-soft:#dff3e7; --bad:#c2372f; --bad-soft:#fae3e1; --warn:#a8680b;
  --c-ink:#14202b; --c-a:#d55e00; --c-b:#0072b2; --c-c:#009e73; --c-d:#cc79a7;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 6px 24px rgba(20,32,43,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151d; --card:#16202b; --ink:#e8eef4; --muted:#94a5b5; --line:#263444;
    --accent:#4cc2e8; --accent-ink:#06222d; --accent-soft:#12303d;
    --ok:#4cc88a; --ok-soft:#133a28; --bad:#f08178; --bad-soft:#40201e; --warn:#e3a851;
    --c-ink:#e8eef4; --c-a:#ff9a4d; --c-b:#56b4e9; --c-c:#2fd1a2; --c-d:#e69cc4;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0e151d; --card:#16202b; --ink:#e8eef4; --muted:#94a5b5; --line:#263444;
  --accent:#4cc2e8; --accent-ink:#06222d; --accent-soft:#12303d;
  --ok:#4cc88a; --ok-soft:#133a28; --bad:#f08178; --bad-soft:#40201e; --warn:#e3a851;
  --c-ink:#e8eef4; --c-a:#ff9a4d; --c-b:#56b4e9; --c-c:#2fd1a2; --c-d:#e69cc4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
h1,h2,h3{line-height:1.2;margin:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;transition:transform .05s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.big{padding:14px 22px;font-size:1.05rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.status{white-space:nowrap}
@media (max-width:520px){.top.compact .bt{display:none}}
.top .back{padding:8px 12px;font-size:.9rem;white-space:nowrap}
.top .brand{min-width:0;flex:0 1 auto}.top .brand .bt{overflow:hidden;text-overflow:ellipsis}.top>.btn{flex:none}
@media (max-width:520px){.top .back{padding:6px 9px;font-size:.82rem}}
.brand{white-space:nowrap;font-weight:800;letter-spacing:-.01em;font-size:1.15rem;display:flex;gap:10px;align-items:center;cursor:pointer}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:700}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)} .dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}

/* home */
.hero{margin:12px 0 28px}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.02em}
.hero p{font-size:1.1rem;color:var(--muted);max-width:56ch;margin:10px 0 0}
.choice h2{font-size:1.25rem;margin-bottom:6px}
.choice p{margin:0 0 16px;color:var(--muted)}
.codein{font:700 1.4rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.25em;text-transform:uppercase;text-align:center;width:9.5em;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.codein:focus{outline:2px solid var(--accent);border-color:transparent}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;min-width:150px;flex:1 1 220px;transition:border-color .15s,background .15s}
.chip b{display:block}
.chip span{font-size:.82rem;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.on b{color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}

/* question */
.qmeta{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px}
.qtext{font-size:1.15rem;line-height:1.5}
.qtext p{margin:0 0 .6em}
.fig{margin:16px auto 4px;max-width:520px}
.fig svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
.fig.net{max-width:440px}
.figs{display:grid;gap:10px}
.figs>.fig{width:100%}
.fig.img img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#fff}
.fig.img .cap{font-size:.82rem;color:var(--muted);margin-top:4px}
.pm .fig.img img{max-height:calc(100vh - 190px);object-fit:contain}
/* true/false sets and short answers */
.tflist{display:grid;gap:8px;margin-top:10px}
.tfrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.tfrow .tft{flex:1;min-width:0}
.tfrow.ok{border-color:var(--ok);background:var(--ok-soft)} .tfrow.bad{border-color:var(--bad);background:var(--bad-soft)}
.tfrow .segs{flex:none}
.tfrow .seg.truth{box-shadow:0 0 0 2px var(--ok) inset}
.tfexp{font-size:.88rem;color:var(--muted);margin-top:4px}
@media (max-width:560px){.tfrow{flex-direction:column;align-items:stretch}.tfrow .segs{justify-content:flex-end}}
.myans{width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;resize:vertical}
.critbox{margin-top:14px;display:grid;gap:6px}
.crit{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.crit.on{border-color:var(--ok);background:var(--ok-soft)}
.crit .cb{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;font-weight:800;font-size:.85rem}
.crit.on .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.opts{display:grid;gap:10px;margin:18px 0 0}
.opt{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:.9rem;border:1px solid var(--line)}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere;position:relative}
.opt .cnt{flex:none;font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.opt.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--pct,0%);background:var(--barc,var(--accent));opacity:.22;transition:width .5s}
.opt.ok.stat{--barc:var(--ok)} .opt.bad.stat{--barc:var(--bad)}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback h3{font-size:1.05rem;margin-bottom:6px}
.src{font-size:.8rem;color:var(--muted);margin-top:8px}
table.tbl{border-collapse:collapse;margin:10px 0 0;font-size:.85em;max-width:100%}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:4px 8px;text-align:center}
table.tbl th:first-child{text-align:left;font-weight:600;background:var(--bg)}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.big-score{font-size:3.2rem;font-weight:800;letter-spacing:-.02em}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.li .m{flex:none;width:22px;text-align:center;font-weight:800}
.li.ok .m{color:var(--ok)} .li.bad .m{color:var(--bad)}
.field{display:flex;align-items:center;gap:8px}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* figure colours */
.fig svg text{fill:var(--c-ink);font:13px system-ui,sans-serif}
.fig svg .ax{stroke:var(--c-ink);stroke-width:1.4;fill:none}
.fig svg .grid{stroke:var(--line);stroke-width:1}
.fig svg .lab{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;font-weight:700;font-size:14px}

/* student live */
.live{max-width:640px}
.status{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.card.wait{text-align:center;padding:48px 12px}
.card.wait .spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);margin:0 auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600}
.banner.warn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* check page */
.dropzone{display:block;border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer}
.dropzone.over,.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}

/* difficulty */
.diff{display:inline-flex;gap:1px;align-items:center;margin-left:10px;font-size:.78em;letter-spacing:.06em;white-space:nowrap;font-weight:700;color:var(--accent);text-transform:none}
.diff .off{color:var(--line)}
.diff.d1{color:var(--ok)} .diff.d3{color:var(--bad)}
.st-tbl .diff{margin-left:0}

/* statistics */
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.st-tile{padding:14px 16px}
.st-big{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.st-h{margin:26px 0 10px}
.st-tbl{padding:6px 10px;overflow-x:auto}
.st-tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.st-tbl th,.st-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.st-tbl tr:last-child td{border-bottom:0}
.st-tbl th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.st-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-tbl .mono{font:600 .82rem ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.st-bar{width:120px;margin:0}
@media (max-width:560px){.st-bar{width:60px}}

/* session setup */
.sumbox{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sumtxt{font-size:1.05rem}
.modal.setup{width:min(92vw,900px)}
.slab{margin:18px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.seg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.link-like{background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.cb{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--accent-ink)}
.cb.on,.sq.on .cb{background:var(--accent);border-color:var(--accent)}
.sqlist{display:grid;gap:6px}
.sqh{display:flex;gap:10px;align-items:baseline;margin:12px 0 2px}
.sq{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sq[data-act]{cursor:pointer}
.sq[data-act]:hover{border-color:var(--accent)}
.sq.on[data-act]{border-color:var(--accent);background:var(--accent-soft)}
.sqm{flex:1;min-width:0}
.sq .id{font:600 .8rem ui-monospace,monospace;color:var(--muted)}
.sq .st{margin-left:8px;font-size:.75rem;color:var(--warn);font-weight:700}
.sqt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.88rem;color:var(--muted);margin-top:2px}
.sqt p{display:inline;margin:0}
.sqt .katex-display{display:inline;margin:0}

/* presenter */
.proj{min-height:100vh;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:16px;padding:12px 28px;font-size:clamp(14px,1.35vw,22px);border-bottom:1px solid var(--line);background:var(--card)}
.ph .lec{font-weight:700}
.ph .sp{flex:1}
.pm{flex:1;display:grid;gap:32px;padding:18px 28px 16px;align-content:start;grid-template-columns:1fr}
.pm.hasfig{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:900px){.pm.hasfig{grid-template-columns:1fr}}
.pm .qtext{font-size:clamp(20px,2.3vw,42px);line-height:1.35}
.pm .opts{gap:clamp(8px,1vw,16px)}
.pm .opt{font-size:clamp(16px,1.85vw,34px);padding:clamp(6px,.8vw,16px) clamp(12px,1.4vw,24px);cursor:default;border-width:3px}
.pm .opt .k{width:1.5em;height:1.5em;font-size:.8em;border-radius:.4em}
.pm .fig{max-width:none;width:100%;margin:0;position:sticky;top:16px}
.pm .fig svg{max-height:calc(100vh - 190px)}
.pm .figs .fig svg{max-height:calc((100vh - 200px)/2)}
.pm .figs{position:sticky;top:16px;align-content:start} .pm .figs .fig{position:static} .pm .fig.net{max-width:none}
.pm .feedback{font-size:clamp(16px,1.6vw,28px)}
.pf{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 28px;border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.pf .info{font-size:.85rem;color:var(--muted);margin-right:auto}
.pf .info b{color:var(--ink)}
.tally{display:flex;gap:clamp(10px,1.6vw,28px);flex-wrap:wrap;margin:clamp(12px,1.6vw,24px) 0 0;font-size:clamp(16px,1.9vw,32px);font-weight:700}
.anscount{display:flex;align-items:baseline;gap:.35em;flex-wrap:wrap;margin:clamp(12px,1.6vw,24px) 0 0;font-size:clamp(18px,2vw,34px);font-weight:700}
.anscount .anum{font-size:2.1em;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.tally .ok{color:var(--ok)} .tally .bad{color:var(--bad)} .tally .no{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:18px;padding:26px;max-width:min(92vw,980px);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.qrbox{background:#fff;padding:14px;border-radius:14px;display:inline-block;line-height:0}
.qrbox svg{width:min(60vh,70vw,520px);height:auto}
.code{font:800 clamp(28px,4vw,56px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;padding:28px;flex:1}
@media (max-width:820px){.lobby{grid-template-columns:1fr;justify-items:center;text-align:center}}
.lobby .qrbox svg{width:min(42vh,80vw,420px)}
.joinurl{font:600 clamp(14px,1.4vw,22px) ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--accent)}
.bigcount{font-size:clamp(28px,3.4vw,56px);font-weight:800}
.qlist{display:grid;gap:6px;min-width:min(86vw,640px)}
.qli{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);text-align:left}
.qli:hover{border-color:var(--accent)}
.qli.cur{border-color:var(--accent);background:var(--accent-soft)}
.qli .id{font:700 .8rem ui-monospace,Menlo,monospace;color:var(--muted);flex:none;width:4.2em}
.qli .tp{flex:1}
.qli .st{flex:none;font-size:.82rem;color:var(--muted)}
.hide-cursor{cursor:none}
</style>
</head>
<body>
<div id="app"></div>
<noscript><div class="wrap">This quiz needs JavaScript.</div></noscript>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script>
(function(){
'use strict';

/* ====================================================================
   SETTINGS  (edit here)
   ==================================================================== */
const BUILD        = '2026-10-28 07:33';                // version stamp (shown at the bottom of the pages)
const TITLE        = 'Lecture quizzes';          // site title (course picker); each course has its own title
const COURSE_DIR   = 'courses/';                 // where courses.js and the course files live
// LIVE MODE TRANSPORT: messages travel through free public MQTT brokers (MQTT over secure WebSocket, no account needed).
// The presenter page connects to ALL brokers in the list; each student uses the first one that works.
// You can add or replace entries with your own broker, e.g. 'wss://mqtt.example.org:443/mqtt'.
const BROKERS      = window.SBQ_BROKERS || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const TOPIC_PREFIX = 'lecture-quiz/v1/';          // topics: <prefix><ROOMCODE>/state|host|p|a|s/<student>

function normCourse(id, spec){
  const unit = spec.unit || 'Lecture', lectures = {};
  for(const [k, v] of Object.entries(spec.lectures || {})){
    const n = +k, o = typeof v === 'string' ? {name:v} : Object.assign({}, v);
    o.label = o.label || (o.plain ? o.name : unit + ' ' + n + ' · ' + o.name);
    o.abbr = o.abbr || (unit[0] + n);
    lectures[n] = o;
  }
  const questions = (spec.questions || []).map(q => Object.assign({diff:2}, q));
  return { id, title: spec.title || id, description: spec.description || '', unit, lang: spec.lang || 'en', lectures, questions,
           lint: lintCourse(id, spec, lectures, questions) };
}
function lintCourse(id, spec, lectures, questions){
  const errs = [], ids = new Set();
  if(!/^[a-z0-9][a-z0-9-]{1,30}$/.test(id)) errs.push({id:'(course)', m:'course id must be 2-31 lower-case letters, digits or -'});
  if(!spec.title) errs.push({id:'(course)', m:'missing title'});
  if(!questions.length) errs.push({id:'(course)', m:'no questions'});
  for(const q of questions){
    const e = m => errs.push({id: q.id || '(no id)', m});
    if(!q.id || !/^[A-Za-z0-9_-]{1,24}$/.test(q.id)) e('id missing or not made of letters, digits, - and _ (max 24)');
    if(ids.has(q.id)) e('duplicate id'); ids.add(q.id);
    if(!lectures[q.lec]) e('lec ' + q.lec + ' is not in lectures');
    if(![1, 2, 3].includes(q.diff)) e('diff must be 1, 2 or 3');
    const ty = q.type || 'sc';
    if(!['sc','tf','short'].includes(ty)) e('type must be sc, tf or short');
    if(!q.q || !q.topic || (ty !== 'short' && !q.exp)) e('missing q, exp or topic');
    if(ty === 'sc'){
      if(!Array.isArray(q.opts) || q.opts.length < 2 || q.opts.length > 8) e('needs 2-8 options');
      else { if((q.ans || 0) >= q.opts.length) e('ans out of range'); if(new Set(q.opts).size !== q.opts.length) e('duplicate options'); }
    } else if(ty === 'tf'){
      if(!Array.isArray(q.statements) || q.statements.length < 2 || q.statements.length > 8) e('true/false set needs 2-8 statements');
      else q.statements.forEach((st, i) => { if(!st || !st.t) e('statement ' + (i + 1) + ' has no text (t)'); if(typeof st.ok !== 'boolean') e('statement ' + (i + 1) + ': ok must be true or false'); });
    } else if(ty === 'short'){
      if(!q.model) e('short answer needs a model answer (model)');
      if(!Array.isArray(q.criteria) || !q.criteria.length) e('short answer needs criteria: [ … ]');
    }
    const txt = (q.q || '') + (q.opts || []).join('') + (q.exp || '') + (q.statements || []).map(st => (st && st.t || '') + (st && st.exp || '')).join('') + (q.model || '') + (q.criteria || []).join('');
    if(txt.split('$').length % 2 === 0) e('unbalanced $ (LaTeX)');
    const bare = txt.match(/<(?!\/?(b|i|u|br|p|table|tr|th|td|em|strong|sub|sup|span|code)\b)[A-Za-z]/);
    if(bare) e('"' + bare[0] + '" would be read as an HTML tag — write \\lt instead of < (and \\gt instead of >) in formulas');
    for(const F of (q.fig ? [].concat(q.fig) : []).concat(q.expfig ? [].concat(q.expfig) : [])){
      if(!F || typeof F !== 'object'){ e('fig is not an object'); continue; }
      if(F.img){ if(typeof F.img !== 'string' || !/\.(jpe?g|png|gif|svg|webp)$/i.test(F.img)) e('img must be a .jpg/.png/.gif/.svg/.webp file name'); continue; }
      if(F.net){ const ns = Object.keys(F.nodes || {}); (F.edges || []).forEach((ed, i) => {
          if(!ns.includes(ed.a)) e('diagram: unknown node ' + ed.a);
          if(!(ns.includes(ed.b) || (/^@\d+$/.test(ed.b) && +ed.b.slice(1) < i))) e('diagram: bad edge target ' + ed.b); }); continue; }
      if(!Array.isArray(F.x) || !Array.isArray(F.y)) { e('graph needs x:[min,max] and y:[min,max]'); continue; }
      for(const c of F.curves || []){
        const ex = c.fn || c.fx, v = c.fn ? 'x' : 'y', rng = c.fn ? F.x : F.y;
        try{ const f = new Function(v, 'with(Math){return (' + ex + ');}'); if(!isFinite(f((rng[0] + rng[1]) / 2))) e('formula gives no number in the middle of the range: ' + ex); }
        catch(err){ e('formula does not parse: ' + ex); }
      }
    }
  }
  return errs;
}

    else if(c.fx){ f=mk(c.fx,'y'); for(let i=0;i<=N;i++){ const y=y0+(y1-y0)*i/N, x=f(y); if(!isFinite(x)){started=false;continue;} d+=(started?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1); started=true; } }
    o+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(c.lw||2.6)+'" stroke-linecap="round" stroke-linejoin="round"'+(c.dash?' stroke-dasharray="7 6"':'')+'/>';
    if(c.lab){ let lx,ly; if(c.fn){ lx=c.labx!=null?c.labx:x0+(x1-x0)*0.9; ly=f(lx)+(c.laby||0); } else { ly=c.laby!=null?c.laby:y0+(y1-y0)*0.5; lx=f(ly)+(c.labx||0); } labels.push('<text class="lab" x="'+sx(lx)+'" y="'+sy(ly)+'" fill="'+col+'" style="fill:'+col+'" text-anchor="middle">'+esc(c.lab)+'</text>'); }
  });
  (s.pts||[]).forEach(p=>{
    const filled=p.fill===true?'var(--c-ink)':(p.fill==='n'?'var(--card)':'none');
    o+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="6" fill="'+filled+'" stroke="var(--c-ink)" stroke-width="2"/>';
    if(p.lab) labels.push('<text class="lab" x="'+(sx(p.x)+11)+'" y="'+(sy(p.y)-10)+'">'+esc(p.lab)+'</text>');
  });
  o+=labels.join('')+'</g></svg>';
  return o;
}
/* Network diagrams:  fig = { net:true, w, h,
     nodes:{ X:[x,y] | {x,y,lab,kind:'sink'} },            (labels longer than 2 characters get a box instead of a circle)
     edges:[ {a:'X', b:'Y', t:'+'|'-'|'f', bend, loop:'up'|'down'|'left'|'right', lab} ],   b:'@2' = middle of edge 2
     texts:[ {x,y,t,b:bold,c:'a'} ] }                       (pixel coordinates in a w x h box)                              */
function netFig(s){
  const W=s.w||440, H=s.h||210, N={}, mid=[];
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="network diagram">';
  for(const [k,v0] of Object.entries(s.nodes||{})){
    const v=Array.isArray(v0)?{x:v0[0],y:v0[1]}:Object.assign({},v0); v.lab=v.lab||k;
    if(v.kind==='sink'){ v.hw=v.hh=9; v.circ=true; }
    else if(v.lab.length<=2){ v.hw=v.hh=21; v.circ=true; }
    else { v.hw=v.lab.length*4.6+14; v.hh=17; }
    N[k]=v;
  }
  const edgeOut=(n,ux,uy)=>{ if(n.circ) return n.hw; const tx=Math.abs(ux)>1e-6?n.hw/Math.abs(ux):1e9, ty=Math.abs(uy)>1e-6?n.hh/Math.abs(uy):1e9; return Math.min(tx,ty); };
  const head=(x,y,ux,uy,t,col)=>{ // arrow head / bar at (x,y) pointing along (ux,uy)
    const px=-uy, py=ux;
    if(t==='-') return '<path d="M'+(x+px*8)+' '+(y+py*8)+'L'+(x-px*8)+' '+(y-py*8)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>';
    return '<path d="M'+x+' '+y+'L'+(x-ux*12+px*6)+' '+(y-uy*12+py*6)+'L'+(x-ux*12-px*6)+' '+(y-uy*12-py*6)+'Z" fill="'+col+'"/>';
  };
  let lines='', labels='';
  (s.edges||[]).forEach((e,i)=>{
    const A=N[e.a], col=e.t==='f'?'var(--muted)':'var(--c-ink)', dash=e.t==='f'?' stroke-dasharray="5 5"':'';
    if(e.a===e.b){ // self loop
      const d=e.loop||'up', ang={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[d], r0=A.circ?A.hw:A.hh, P=(a,r)=>[A.x+r*Math.cos(a),A.y+r*Math.sin(a)];
      const [sx0,sy0]=P(ang-0.55,r0+1), [ex,ey]=P(ang+0.55,r0+(e.t==='-'?4:2)), [c1x,c1y]=P(ang-0.5,r0+60), [c2x,c2y]=P(ang+0.5,r0+60);
      const ux=ex-c2x, uy=ey-c2y, L=Math.hypot(ux,uy);
      lines+='<path d="M'+sx0+' '+sy0+'C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+ex+' '+ey+'" fill="none" stroke="'+col+'" stroke-width="2.4"'+dash+'/>'+head(ex,ey,ux/L,uy/L,e.t,col);
      const [lx,ly]=P(ang,r0+50); mid[i]=[lx,ly];
      if(e.lab) labels+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle">'+esc(e.lab)+'</text>';
      return;
    }
    let Bx,By,B=null;
    if(typeof e.b==='string'&&e.b[0]==='@'){ [Bx,By]=mid[+e.b.slice(1)]; } else { B=N[e.b]; Bx=B.x; By=B.y; }
    const bend=e.bend||0, dx=Bx-A.x, dy=By-A.y, len=Math.hypot(dx,dy), cx=(A.x+Bx)/2-dy/len*bend*len, cy=(A.y+By)/2+dx/len*bend*len;
    let u1x=cx-A.x, u1y=cy-A.y, l1=Math.hypot(u1x,u1y); u1x/=l1; u1y/=l1;
    let u2x=Bx-cx, u2y=By-cy, l2=Math.hypot(u2x,u2y); u2x/=l2; u2y/=l2;
    const sx0=A.x+u1x*(edgeOut(A,u1x,u1y)+3), sy0=A.y+u1y*(edgeOut(A,u1x,u1y)+3);
    const back=B?edgeOut(B,u2x,u2y)+(e.t==='-'?5:3):(e.t==='-'?2:0), ex=Bx-u2x*back, ey=By-u2y*back;
    lines+='<path d="M'+sx0+' '+sy0+'Q'+cx+' '+cy+' '+ex+' '+ey+'" fill="none" stroke="'+col+'" stroke-width="2.4"'+dash+'/>'+(e.t==='f'?head(ex,ey,u2x,u2y,'+',col):head(ex,ey,u2x,u2y,e.t,col));
    mid[i]=[0.25*sx0+0.5*cx+0.25*ex, 0.25*sy0+0.5*cy+0.25*ey];
    if(e.lab) labels+='<text x="'+(mid[i][0]-dy/len*16)+'" y="'+(mid[i][1]+dx/len*16+4)+'" text-anchor="middle" style="font-size:12px">'+esc(e.lab)+'</text>';
  });
  o+=lines;
  for(const v of Object.values(N)){
    if(v.kind==='sink'){ o+='<text x="'+v.x+'" y="'+(v.y+6)+'" text-anchor="middle" style="font-size:18px">∅</text>'; continue; }
    o+=(v.circ?'<circle cx="'+v.x+'" cy="'+v.y+'" r="'+v.hw+'"':'<rect x="'+(v.x-v.hw)+'" y="'+(v.y-v.hh)+'" width="'+2*v.hw+'" height="'+2*v.hh+'" rx="9"')+' fill="var(--card)" stroke="var(--c-ink)" stroke-width="2"/>';
    o+='<text x="'+v.x+'" y="'+(v.y+5)+'" text-anchor="middle" style="font-weight:700;font-size:'+(v.circ?16:14)+'px'+(v.it?';font-style:italic':'')+'">'+esc(v.lab)+'</text>';
  }
  (s.texts||[]).forEach(t=>labels+='<text x="'+t.x+'" y="'+t.y+'" text-anchor="'+(t.a||'middle')+'" style="'+(t.b?'font-weight:800;':'')+(t.c?'fill:var(--c-'+t.c+');':'')+'font-size:'+(t.s||13)+'px">'+esc(t.t)+'</text>');
  return o+labels+'</svg>';
}
const figOne = f => f.img ? '<div class="fig img"><a href="'+esc(COURSE_DIR+f.img)+'" target="_blank" rel="noopener"><img src="'+esc(COURSE_DIR+f.img)+'" alt="'+esc(f.alt||T('Figure'))+'" loading="lazy"></a>'+(f.cap?'<div class="cap">'+esc(f.cap)+'</div>':'')+'</div>'
  : '<div class="fig'+(f.net?' net':'')+'">'+(f.net?netFig(f):plot(f))+'</div>';

let route = {name:'home'};
function go(r){ cleanup(); route=r; render(); window.scrollTo(0,0); }
function cleanup(){ if(route.name==='host') hostLeave(); if(route.name==='live') studentLeave(); document.onkeydown=null; }
function bootRoute(){
  const qs = new URLSearchParams(location.search), act = activeCourses(), want = qs.get('course');
  if(!qs.get('join') && !/^#(host|stats|check)$/.test(location.hash) && !bootRoute.counted){ bootRoute.counted=true; count('visits'); }
  if(want && !useCourse(want)) { route={name:'courses', missing:want}; render(); return; }
  if(!COURSE && act.length===1) useCourse(act[0].id);
  if(location.hash==='#check') { route={name:'check'}; render(); return; }
  if(qs.get('join')) { route={name:'live', code:qs.get('join').toUpperCase().replace(/[^A-Z0-9]/g,'')}; render(); return; }
  if(!COURSE && (location.hash==='#host' || location.hash==='#stats')){ const last=LS.get('lq.lastcourse',null); if(last && useCourse(last)){} else if(act.length) useCourse(act[0].id); }
  if(!COURSE) { route={name:'courses'}; render(); return; }
  LS.set('lq.lastcourse', COURSE.id);
  if(location.hash==='#host' || qs.has('host')) { route={name:'host'}; }
  else if(location.hash==='#stats') { route={name:'stats'}; }
  else route={name:'home'};
  if(route.name==='home' && !bootRoute.counted){ bootRoute.counted=true; count('visits'); }
  render();
}
function render(){
  document.body.classList.remove('hide-cursor');
  if(route.name==='home') viewHome();
  else if(route.name==='practice') viewPractice();
  else if(route.name==='live') viewLive();
  else if(route.name==='host') viewHost();
  else if(route.name==='stats') viewStats();
  else if(route.name==='courses') viewCourses();
  else if(route.name==='check') viewCheck();
}
function header(extra){
  const back = COURSE && route.name!=='courses' && route.name!=='live' && activeCourses().length>1 ? '<button class="btn ghost back" data-act="allcourses" title="'+T('Back to the list of courses')+'">'+T('← All courses')+'</button>' : '';
  return '<div class="top'+(extra?' compact':'')+'">'+back+'<div class="brand" data-act="home"><div class="logo"><svg viewBox="0 0 64 64"><path d="M8 44 C20 44 20 18 32 18 S44 44 56 44" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg></div><span class="bt">'+esc(COURSE?COURSE.title+' '+T('Quiz'):TITLE)+'</span></div><div class="grow"></div>'+(extra||'')+
    '<button class="btn ghost" data-act="theme" title="Toggle light / dark" aria-label="Toggle theme">'+THEME_ICON+'</button></div>';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t || t.disabled) return;
  if(t.classList.contains('overlay') && e.target!==t) return; // clicks inside a modal don't close it
  const act=t.dataset.act, arg=t.dataset.arg;
  const fn = ACTS[act]; if(fn) fn(arg, t, e);
});
const ACTS = {
  home(){ if(!COURSE){ history.replaceState(null,'',location.pathname); go({name:'courses'}); return; } history.replaceState(null,'',courseURL(COURSE.id)); go({name:'home'}); },
  allcourses(){ COURSE=null; document.title=TITLE; history.replaceState(null,'',location.pathname+'?all'); go({name:'courses'}); },

  theme(){ const cur=document.documentElement.getAttribute('data-theme'); const dark=window.matchMedia('(prefers-color-scheme: dark)').matches; const next=(cur?cur==='dark':dark)?'light':'dark'; document.documentElement.setAttribute('data-theme',next); LS.set('lq.theme',next); },
  practice(){ go({name:'practice', stage:'setup'}); },
  host(){ history.replaceState(null,'',courseURL(COURSE.id,'#host')); go({name:'host'}); },
  joinGo(){ const v=(document.getElementById('code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.length<3){ document.getElementById('code').focus(); return; } history.replaceState(null,'',location.pathname+'?join='+v); go({name:'live', code:v}); },
};

/* ====================================================================
   PRACTICE MODE
   ==================================================================== */
const getProg = () => LS.get(K('progress'), {});
function viewPractice(){ if(route.stage==='setup') practiceSetup(); else if(route.stage==='run') practiceRun(); else practiceDone(); }

function practiceSetup(){
  const prog=getProg();
  const chips = lecNums.map(n=>{
    const qs=QUESTIONS.filter(q=>q.lec===n); if(!qs.length) return '';
    const mastered=qs.filter(q=>prog[q.id]&&prog[q.id].last).length, on=PR.sel.includes(n);
    return '<button class="chip'+(on?' on':'')+'" data-act="pchip" data-arg="'+n+'"><b>'+esc(lecLabel(n))+'</b><span>'+T('{0} questions · {1} answered correctly',qs.length,mastered)+'</span><div class="bar"><i style="width:'+Math.round(100*mastered/qs.length)+'%"></i></div></button>';
  }).join('');
  const types=[...new Set(QUESTIONS.map(qType))], TYPE_NAME={sc:'single choice', tf:'true / false', short:'short answer'};
  const total = QUESTIONS.filter(q=>PR.sel.includes(q.lec)&&PR.diff.includes(q.diff)&&PR.types.includes(qType(q))).length;
  app.innerHTML='<div class="wrap">'+header()+'<div class="stack"><div><h2>'+T('Practice')+'</h2><p class="muted" style="margin:6px 0 0">'+T('Choose the lectures you want to be quizzed on.')+'</p></div>'+
   '<div class="chips">'+chips+'</div>'+
   '<div class="card stack"><div class="row"><div class="field"><label for="nq">'+T('Number of questions')+'</label><select id="nq">'+[5,10,20,0].map(v=>'<option value="'+v+'"'+(PR.n===v?' selected':'')+'>'+(v||T('All'))+'</option>').join('')+'</select></div></div>'+
   '<div class="row"><span>'+T('Difficulty')+'</span><div class="segs">'+[1,2,3].map(d=>'<button class="seg'+(PR.diff.includes(d)?' on':'')+'" data-act="pdiff" data-arg="'+d+'">'+'●'.repeat(d)+' '+T(DIFF[d])+'</button>').join('')+'</div></div>'+
   (types.length>1?'<div class="row"><span>'+T('Question types')+'</span><div class="segs">'+types.map(t=>'<button class="seg'+(PR.types.includes(t)?' on':'')+'" data-act="ptype" data-arg="'+t+'">'+T(TYPE_NAME[t])+' ('+QUESTIONS.filter(q=>qType(q)===t).length+')</button>').join('')+'</div></div>':'')+
   '<label class="toggle"><input type="checkbox" id="focus"'+(PR.focus?' checked':'')+'><span>'+T('Focus on questions I have not seen or got wrong last time')+'</span></label>'+
   '<div class="row spread"><span class="muted">'+T('{0} questions available',total)+'</span><button class="btn primary big" data-act="pstart"'+(total?'':' disabled')+'>'+T('Start')+'</button></div></div>'+
   '<p class="muted small"><button class="link" data-act="presetprog">'+T('Reset my progress')+'</button></p></div></div>';
  document.getElementById('nq').onchange=e=>{PR.n=+e.target.value; LS.set(K('prefs'),PR);};
  document.getElementById('focus').onchange=e=>{PR.focus=e.target.checked; LS.set(K('prefs'),PR);};
}
Object.assign(ACTS,{
  pdiff(d){ d=+d; const i=PR.diff.indexOf(d); if(i>=0){ if(PR.diff.length>1) PR.diff.splice(i,1); } else PR.diff.push(d); LS.set(K('prefs'),PR); practiceSetup(); },
  ptype(t){ const i=PR.types.indexOf(t); if(i>=0){ if(PR.types.length>1) PR.types.splice(i,1); } else PR.types.push(t); LS.set(K('prefs'),PR); practiceSetup(); },
  pchip(n){ n=+n; const i=PR.sel.indexOf(n); if(i>=0) PR.sel.splice(i,1); else PR.sel.push(n); LS.set(K('prefs'),PR); practiceSetup(); },
  presetprog(){ if(confirm(T('Delete your saved practice progress in this browser?'))){ LS.set(K('progress'),{}); practiceSetup(); } },
  pstart(){
    let pool=QUESTIONS.filter(q=>PR.sel.includes(q.lec)&&PR.diff.includes(q.diff)&&PR.types.includes(qType(q))); const prog=getProg();
    if(PR.focus){ const f=pool.filter(q=>!(prog[q.id]&&prog[q.id].last)); if(f.length>=3) pool=f; }
    pool=shuffled(pool,Math.random); if(PR.n>0) pool=pool.slice(0,PR.n);
    route={name:'practice', stage:'run', pool, i:0, res:[], seed:Math.random().toString(36).slice(2), sel:null, checked:false, tf:{}, crit:{}};
    count('sessions.'+COURSE.id);
    render(); window.scrollTo(0,0);
  },
  psel(i){ if(route.checked) return; route.sel=+i; practiceRun(true); },
  ptf(a){ if(route.checked) return; const [i,v]=a.split(':'), cur=route.tf[i]; route.tf[i] = (cur===(v==='1')) ? undefined : v==='1'; practiceRun(true); },
  pcrit(i){ route.crit[i]=!route.crit[i]; practiceRun(true); },
  pcheck(){
    const q=route.pool[route.i], t=qType(q); if(route.checked) return;
    if(t==='sc'){ if(route.sel==null) return; const ok=route.sel===correctOf(q); practiceRecord(q, ok?1:0); }
    else if(t==='tf'){ if(!Object.values(route.tf).some(v=>v!==undefined)) return; practiceRecord(q, tfScore(q, route.tf).score); }
    else { const ta=document.getElementById('myans'); route.myans=ta?ta.value:''; route.checked=true; }   // short answer: scored when moving on (self-assessment)
    route.checked=true; practiceRun(true);
  },
  pnext(){
    const q=route.pool[route.i];
    if(qType(q)==='short' && route.checked && !route.recorded){ const n=(q.criteria||[]).length, k=Object.values(route.crit).filter(Boolean).length; practiceRecord(q, n?k/n:0); }
    if(route.i+1>=route.pool.length){ route.stage='done'; render(); window.scrollTo(0,0); } else { route.i++; route.sel=null; route.checked=false; route.recorded=false; route.tf={}; route.crit={}; route.myans=''; practiceRun(); window.scrollTo(0,0); } },
  pretry(){ const wrong=route.res.filter(r=>!r.ok).map(r=>byId[r.id]); route={name:'practice',stage:'run',pool:shuffled(wrong,Math.random),i:0,res:[],seed:Math.random().toString(36).slice(2),sel:null,checked:false,retry:true,tf:{},crit:{}}; render(); },
  pagain(){ go({name:'practice',stage:'setup'}); },
});

// score of a true/false set: +1 per right judgement, -1 per wrong one, 0 if blank; max(0,sum)/n
function tfScore(q, ans){ let s=0, right=0; q.statements.forEach((st,i)=>{ const a=ans[i]; if(a===undefined) return; if(a===!!st.ok){ s++; right++; } else s--; }); return {score: Math.max(0,s)/q.statements.length, right}; }
function practiceRecord(q, score){
  const ok = score >= 0.999; route.recorded = true; route.res.push({id:q.id, ok, score});
  if(!route.retry){ count('q.'+COURSE.id+'.'+q.id+'.n'); if(ok) count('q.'+COURSE.id+'.'+q.id+'.ok'); }   // anonymous totals (retry rounds not counted)
  const prog=getProg(), p=prog[q.id]||{n:0,c:0}; p.n++; if(ok)p.c++; p.last=ok; prog[q.id]=p; LS.set(K('progress'),prog);
}
const srcLine = q => q.src ? '<div class="src">'+T('Modelled on: ')+esc(q.src)+'</div>' : '';

function studentConnect(){

  const url=BROKERS[me.bi]; let first=false, failed=false; me.cid=Math.random().toString(36).slice(2,8);
  me.everConnected=false; studentUpd(); studentPaint();
  const cl=mqtt.connect(url,{clientId:'sbq_'+me.sid.slice(0,12)+'_'+Math.random().toString(36).slice(2,7), clean:true, keepalive:30,

  me.cl=cl;

    me.bi++;

  };

    if(S!==me||me.cl!==cl) return; first=true; me.everConnected=true; clearTimeout(t1); cl.options.reconnectPeriod=2000;

function studentState(m){

let H=null;
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:5},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const joinURL = () => location.origin+location.pathname+'?join='+H.code;
const N_CHOICES=[3,5,8,10,12,15,20,0];
function hostLoad(){
  const sv=LS.get(K('host'),{})||{};
  const c=Object.assign({sel:sv.sel||lecNums.slice(), diff:[1,2,3], mode:'random', n:8, order:'lec', fresh:true, picks:[], drawn:[], seed:Math.random().toString(36).slice(2)}, sv.cfg||{});
  H={ code:sv.code||genCode(), cfg:c, plan:Array.isArray(sv.plan)?sv.plan.filter(id=>byId[id]):null, cur:sv.cur||null, phase:sv.phase||'lobby', answers:sv.answers||{},
      rv:sv.rv||1, pres:new Map(), cls:[], status:'connecting', ui:{overlay:null, exp:false}, dead:false };
  if(!H.plan || !H.plan.length) buildPlan(false);
  if(H.phase!=='lobby' && !byId[H.cur]) { H.phase='lobby'; H.cur=null; }
}
function hostSave(){ LS.set(K('host'),{code:H.code, cfg:H.cfg, plan:H.plan, cur:H.cur, phase:H.phase, answers:H.answers, rv:H.rv}); }
const hostPool = () => QUESTIONS.filter(q=>isLive(q)&&H.cfg.sel.includes(q.lec)&&(H.cfg.diff||[1,2,3]).includes(q.diff));
const asked = id => !!(H.answers[id] && Object.keys(H.answers[id]).length);
/* Session plan = ordered list of question ids.  random: draw n from the selected lectures (unasked first if cfg.fresh);
   pick: the ticked questions.  order: 'lec' = order of the question bank, 'shuffle' = stable random order (cfg.seed). */
function buildPlan(redraw){
  const c=H.cfg, pool=hostPool().map(q=>q.id); let ids;
  if(c.mode==='pick'){ ids=c.picks.filter(id=>byId[id]&&pool.includes(id)); }
  else {
    const n=c.n?Math.min(c.n,pool.length):pool.length;
    const ok=!redraw && c.drawn.length===n && c.drawn.every(id=>pool.includes(id));
    if(!ok){
      const fresh=shuffled(pool.filter(id=>!(c.fresh&&asked(id))),Math.random), old=shuffled(pool.filter(id=>c.fresh&&asked(id)),Math.random);
      c.drawn=fresh.concat(old).slice(0,n);
    }
    ids=c.drawn.slice();
  }
  ids.sort((a,b)=>bankIdx[a]-bankIdx[b]);
  if(c.order==='shuffle') ids.sort((a,b)=>hashStr(c.seed+a)-hashStr(c.seed+b));
  H.plan=ids;
  if(H.phase==='lobby') H.cur=null;
  else if(H.cur && !ids.includes(H.cur)){ /* current question dropped from the plan: keep showing it, navigation continues from the plan start */ }
}
function planChanged(redraw){ buildPlan(redraw); hostSave(); if(H.phase!=='lobby') broadcast(); hostPaint(); }
const hostList = () => H.plan.map(id=>byId[id]).filter(Boolean);
const hostQ = () => H.cur ? byId[H.cur] : null;
function counts(q){ const a=H.answers[q.id]||{}, c=(q.opts||[]).map(()=>0); Object.values(a).forEach(v=>{ if(c[v]!=null) c[v]++; }); return c; }
function viewHost(){
  hostLoad(); hostConnect(); hostPaint(); H.cntT=setInterval(hostCount,5000);
  document.onkeydown=hostKey;
  let idle; const wake=()=>{ document.body.classList.remove('hide-cursor'); clearTimeout(idle); idle=setTimeout(()=>{ if(H&&H.phase!=='lobby'&&!H.ui.overlay) document.body.classList.add('hide-cursor'); },3000); };

function hostLeave(){ if(!H) return; H.dead=true; clearInterval(H.cntT); hostClose(false); document.onmousemove=null; H=null; }
function hostClose(clear){
  const code=H.code;

  } else {
    h+='<div class="row spread slab"><span><b>'+H.plan.length+'</b> selected</span><button class="btn ghost" data-act="hpicknone">Clear selection</button></div><div class="sqlist">';
    lecNums.filter(n=>c.sel.includes(n)).forEach(n=>{ const qs=pool.filter(q=>q.lec===n); if(!qs.length) return;
      const k=qs.filter(q=>c.picks.includes(q.id)).length;
      h+='<div class="sqh"><b>'+esc(lecLabel(n))+'</b><span class="muted small">'+k+' / '+qs.length+'</span><button class="link" data-act="hpickall" data-arg="'+n+'">'+(k===qs.length?'none':'all')+'</button></div>'+
        qs.map(q=>setupRow(q,c.picks.includes(q.id),true)).join('');
    });
    h+=(pool.length?'':'<p class="muted">Select at least one lecture.</p>')+'</div>';
  }
  const nOther=QUESTIONS.filter(q=>!isLive(q)).length;
  if(nOther) h+='<p class="muted small" style="margin-top:12px">'+nOther+' true/false and short-answer questions of this course are for practice mode only and are not listed here.</p>';
  if(H.phase!=='lobby') h+='<p class="muted small" style="margin-top:12px">The session is running — changes apply to the remaining questions; collected answers are kept.</p>';
  return h;
}

/* ====================================================================
   STATISTICS  (#stats) — reads the anonymous Abacus counters
   ==================================================================== */
let STL=null, STATS_VIEW={t:0,v:{}};   // running loader, data currently shown
function viewStats(){
  document.title=COURSE.title+' · Statistics';
  const C=LS.get(K('stats'),{t:0,v:{}}); route.sort=route.sort||'lec';
  statsPaint(C);
  if(!STATS_NS) return;
  if(!STL) statsLoad();
}
async function statsLoad(){
  const me=STL={done:0,total:2+QUESTIONS.length,err:''}, v=Object.assign({}, LS.get(K('stats'),{v:{}}).v);
  const get=async key=>{
    for(let tries=0;tries<6;tries++){
      try{
        const r=await fetch(STATS_URL+'/get/'+STATS_NS+'/'+key,{cache:'no-store'});
        if(r.status===404) return 0;
        if(r.status===429){ const w=+(r.headers.get('Retry-After')||10); me.err='Waiting for the counting service (rate limit)…'; statsPaintLive(v); await new Promise(z=>setTimeout(z,(w+1)*1000)); me.err=''; continue; }
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j=await r.json(); return +j.value||0;
      }catch(e){ me.err='Counting service not reachable ('+e.message+') — retrying…'; statsPaintLive(v); await new Promise(z=>setTimeout(z,3000)); }
    }
    return null;
  };
  const pace=()=>new Promise(z=>setTimeout(z,420));        // stay below 30 requests per 10 s
  const alive=()=>STL===me && route.name==='stats';
  for(const k of ['visits','sessions.'+COURSE.id]){ if(!alive()) return; v[k]=await get(k); me.done++; await pace(); }
  for(const q of QUESTIONS){
    if(!alive()) return;
    const n=await get('q.'+COURSE.id+'.'+q.id+'.n'); await pace();
    v['q.'+q.id+'.n']=n; v['q.'+q.id+'.ok']= n ? await get('q.'+COURSE.id+'.'+q.id+'.ok') : 0; if(n) await pace();
    me.done++; if(me.done%5===0) statsPaintLive(v);
  }
  if(STL!==me) return;
  STL=null; const C={t:Date.now(),v}; LS.set(K('stats'),C); if(route.name==='stats') statsPaint(C);
}
function statsPaintLive(v){ if(route.name==='stats') statsPaint({t:STATS_VIEW.t,v}); }
function statsPaint(C){
  STATS_VIEW=C; const v=C.v||{}, has=k=>v[k]!=null, val=k=>v[k]||0;
  const pct=(a,b)=>b?Math.round(100*a/b)+' %':'–';
  let N=0,K=0; const per={};
  QUESTIONS.forEach(q=>{ const n=val('q.'+q.id+'.n'), k=Math.min(n,val('q.'+q.id+'.ok')); N+=n; K+=k; const L=per[q.lec]||(per[q.lec]={n:0,k:0}); L.n+=n; L.k+=k; });
  const tiles=[['Page visits (all courses)',has('visits')?val('visits'):'…'],['Practice sessions',has('sessions.'+COURSE.id)?val('sessions.'+COURSE.id):'…'],['Questions answered',N],['Answered correctly',pct(K,N)]]
    .map(([l,x])=>'<div class="card st-tile"><div class="muted small">'+l+'</div><div class="st-big">'+x+'</div></div>').join('');
  const bar=(k,n)=>n?'<div class="bar st-bar"><i style="width:'+Math.round(100*k/n)+'%"></i></div>':'';
  const lecRows=lecNums.map(n=>{ const L=per[n]||{n:0,k:0}; return '<tr><td>'+esc(lecLabel(n))+'</td><td class="num">'+L.n+'</td><td class="num">'+pct(L.k,L.n)+'</td><td>'+bar(L.k,L.n)+'</td></tr>'; }).join('');
  let qs=QUESTIONS.slice();
  if(route.sort==='hard') qs.sort((a,b)=>{ const f=q=>{ const n=val('q.'+q.id+'.n'); return n? val('q.'+q.id+'.ok')/n : 2; }; return f(a)-f(b); });
  if(route.sort==='most') qs.sort((a,b)=>val('q.'+b.id+'.n')-val('q.'+a.id+'.n'));
  const qRows=qs.map(q=>{ const n=val('q.'+q.id+'.n'), k=Math.min(n,val('q.'+q.id+'.ok')); const loaded=has('q.'+q.id+'.n');
    return '<tr><td class="mono">'+q.id+'</td><td>'+esc(q.topic)+'</td><td>'+diffTag(q)+'</td><td class="num">'+(loaded?n:'…')+'</td><td class="num">'+pct(k,n)+'</td><td>'+bar(k,n)+'</td></tr>'; }).join('');
  const seg=(val2,label)=>'<button class="seg'+(route.sort===val2?' on':'')+'" data-act="ssort" data-arg="'+val2+'">'+label+'</button>';
  const status = !STATS_NS ? 'Counting is switched off (STATS_NS is empty).'
    : STL ? 'Loading… '+STL.done+' / '+STL.total+(STL.err?' · '+esc(STL.err):' · the free counting service allows ~30 requests per 10 s, so this takes about a minute.')
    : C.t ? 'Updated '+new Date(C.t).toLocaleString()+' · <button class="link" data-act="sreload">Reload</button>' : '';
  app.innerHTML='<div class="wrap">'+header()+'<h1 style="margin-bottom:6px">Practice statistics · '+esc(COURSE.title)+'</h1>'+(activeCourses().length>1?'<div class="segs" style="margin:8px 0">'+activeCourses().map(x=>'<a class="seg'+(x.id===COURSE.id?' on':'')+'" style="text-decoration:none;color:inherit" href="'+courseURL(x.id,'#stats')+'">'+esc(x.title)+'</a>').join('')+'</div>':'')+'<p class="muted small">Anonymous totals from the self-study mode (live sessions are not included; repeat rounds of wrong answers are not counted). '+status+'</p>'+
    '<div class="st-tiles">'+tiles+'</div>'+
    '<h2 class="st-h">By lecture</h2><div class="card st-tbl"><table><tr><th>Lecture</th><th class="num">Answers</th><th class="num">Correct</th><th></th></tr>'+lecRows+'</table></div>'+
    '<div class="row spread st-h"><h2>By question</h2><div class="segs">'+seg('lec','Lecture order')+seg('hard','Lowest % correct first')+seg('most','Most answered')+'</div></div>'+
    '<div class="card st-tbl"><table><tr><th>ID</th><th>Topic</th><th>Level</th><th class="num">Answers</th><th class="num">Correct</th><th></th></tr>'+qRows+'</table></div></div>';
}
Object.assign(ACTS,{
  ssort(v){ route.sort=v; statsPaint(STATS_VIEW); },
  sreload(){ if(!STL) statsLoad(); statsPaint(STATS_VIEW); },
});

/* ====================================================================
   CHECK  (#check) — validate and preview a course file before uploading it
   ==================================================================== */
function viewCheck(){
  document.title='Check a course file';
  const rows=COURSE_LIST.map(e=>{ const c=COURSES[e.id]; return '<tr><td class="mono">'+esc(e.id)+'</td><td>'+(e.active?'<b style="color:var(--ok)">active</b>':'<span class="muted">off</span>')+'</td><td>'+(c?esc(c.title):(e.active?'<span style="color:var(--bad)">file did not load</span>':'—'))+'</td><td class="num">'+(c?c.questions.length:'')+'</td><td class="num">'+(c?(c.lint.length?'<span style="color:var(--bad)">'+c.lint.length+'</span>':'0'):'')+'</td><td>'+(c?'<button class="link" data-act="ckshow" data-arg="'+esc(e.id)+'">preview</button>':(e.active?'':'<button class="link" data-act="ckload" data-arg="'+esc(e.id)+'">load &amp; check</button>'))+'</td></tr>'; }).join('');
  app.innerHTML='<div class="wrap" style="max-width:980px">'+header()+'<h1 style="margin-bottom:6px">Check a course file</h1><p class="muted">Pick a course file (<code>*.js</code>) from your computer to see whether it works and how every question looks — before you upload it. Nothing is uploaded from this page.</p>'+
    '<div class="card stack"><label class="dropzone" id="dz"><input type="file" id="ckfile" accept=".js,text/javascript" hidden><b>Choose a course file</b> or drop it here</label></div>'+
    '<h2 class="st-h">Courses on this site</h2><div class="card st-tbl"><table><tr><th>ID</th><th>Status</th><th>Title</th><th class="num">Questions</th><th class="num">Problems</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="muted">courses/courses.js lists no courses</td></tr>')+'</table></div>'+
    '<div id="ckout"></div></div>';
  const f=document.getElementById('ckfile'), dz=document.getElementById('dz');
  f.onchange=()=>{ if(f.files[0]) checkFile(f.files[0]); };
  dz.ondragover=e=>{ e.preventDefault(); dz.classList.add('over'); }; dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove('over'); if(e.dataTransfer.files[0]) checkFile(e.dataTransfer.files[0]); };
}
async function captureScript(url){
  CAPTURE=[]; let syntax=null; const onErr=ev=>{ syntax=ev.message+(ev.lineno?' (line '+ev.lineno+')':''); };
  window.addEventListener('error',onErr); const ok=await loadScript(url); window.removeEventListener('error',onErr);
  const got=CAPTURE; CAPTURE=null; return {ok, syntax, got};
}
async function checkFile(file){
  const text=await file.text(), url=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));
  const res=await captureScript(url); URL.revokeObjectURL(url); checkReport(file.name, res);
}
function checkReport(name, res){
  const out=document.getElementById('ckout'); if(!out) return;
  if(res.syntax || !res.got.length || res.got[0].err){
    out.innerHTML='<div class="banner" style="margin-top:20px">'+esc(name)+': '+esc(res.syntax ? 'JavaScript error: '+res.syntax : res.got.length ? 'error while building the course: '+res.got[0].err : 'no QUIZ.course(…) call found')+'</div>'; return; }
  const g=res.got[0], c=normCourse(g.id, g.spec||{});
  const entry=COURSE_LIST.find(e=>e.id===c.id);
  const per={}; c.questions.forEach(q=>{ const L=per[q.lec]||(per[q.lec]={n:0,d:[0,0,0,0]}); L.n++; L.d[q.diff]++; });
  const sum=Object.keys(c.lectures).map(Number).sort((a,b)=>a-b).map(n=>'<tr><td>'+esc(c.lectures[n].label)+'</td><td class="num">'+(per[n]?per[n].n:0)+'</td><td class="num">'+(per[n]?per[n].d[1]+' / '+per[n].d[2]+' / '+per[n].d[3]:'')+'</td></tr>').join('');
  const errs=c.lint.length ? '<div class="banner" style="margin-top:16px">'+c.lint.length+' problem'+(c.lint.length>1?'s':'')+':<ul style="margin:6px 0 0">'+c.lint.map(e=>'<li><code>'+esc(e.id)+'</code>: '+esc(e.m)+'</li>').join('')+'</ul></div>'
    : '<div class="feedback ok" style="margin-top:16px"><b>✓ No problems found.</b> '+(entry?(entry.active?'This course is active on the site.':'Listed in courses.js but switched off — set <code>active:true</code> to publish it.'):'Upload it to <code>courses/</code> and add <code>{ id:\''+esc(c.id)+'\', file:\''+esc(name)+'\', active:true }</code> to <code>courses/courses.js</code>.')+'</div>';
  const save=COURSE; COURSE=c;     // lecLabel/diffTag use the checked course
  const cards=c.questions.map(q=>{ const ty=q.type||'sc';
    const opts= ty==='tf' ? (q.statements||[]).map(st=>'<div class="opt'+(st.ok?' ok':' bad')+'" style="cursor:default"><span class="k">'+(st.ok?'R':'F')+'</span><span class="t">'+(st.t||'')+(st.exp?'<div class="tfexp">'+st.exp+'</div>':'')+'</span></div>').join('')
      : ty==='short' ? '<div class="feedback"><b>Model answer:</b> '+(q.model||'')+'<ul style="margin:6px 0 0">'+(q.criteria||[]).map(cr=>'<li>'+cr+'</li>').join('')+'</ul></div>'
      : (q.opts||[]).map((o,i)=>'<div class="opt'+(i===correctOf(q)?' ok':'')+'" style="cursor:default"><span class="k">'+(i===correctOf(q)?'✓':LETTERS[i])+'</span><span class="t">'+o+'</span></div>').join('');
    let fig=''; try{ fig=figHTML(q)+(q.expfig?'<div class="muted small" style="margin-top:8px">Figures shown after answering:</div>'+expFigs(q):''); }catch(err){ fig='<div class="banner">figure error: '+esc(err.message)+'</div>'; }
    return '<div class="card" style="margin-top:14px"><div class="qmeta">'+esc(q.id)+(ty!=='sc'?' · '+(ty==='tf'?'TRUE/FALSE':'SHORT ANSWER'):'')+' · '+esc(lecLabel(q.lec))+' · '+esc(q.topic||'')+(DIFF[q.diff]?diffTag(q):'')+'</div><div class="qtext">'+(q.q||'')+'</div>'+fig+'<div class="opts">'+opts+'</div><div class="feedback"><div>'+(q.exp||'')+'</div>'+(q.src?'<div class="src">Modelled on: '+esc(q.src)+'</div>':'')+'</div></div>'; }).join('');
  out.innerHTML='<h2 class="st-h">'+esc(c.title)+' <span class="muted small">('+esc(name)+', id <code>'+esc(c.id)+'</code>)</span></h2>'+errs+
    '<div class="card st-tbl" style="margin-top:14px"><table><tr><th>'+esc(c.unit)+'</th><th class="num">Questions</th><th class="num">easy / medium / hard</th></tr>'+sum+'</table></div>'+
    '<p class="muted small" style="margin-top:14px">All '+c.questions.length+' questions, options in file order (✓ = correct answer; students see them shuffled):</p>'+cards;
  typeset(out); COURSE=save;
  out.scrollIntoView({behavior:'smooth'});
}
Object.assign(ACTS,{
  ckshow(id){ const c=COURSES[id]; if(!c) return; checkReport((COURSE_LIST.find(e=>e.id===id)||{}).file||id, {ok:true, got:[{id, spec:{title:c.title, description:c.description, unit:c.unit, lectures:Object.fromEntries(Object.entries(c.lectures).map(([k,v])=>[k,v])), questions:c.questions}}]}); },
  async ckload(id){ const e=COURSE_LIST.find(x=>x.id===id); if(!e) return; const res=await captureScript(COURSE_DIR+(e.file||id+'.js')+'?v='+Date.now()); checkReport(e.file||id, res); },
});

/* ====================================================================
   START
   ==================================================================== */
const start=()=>loadCourses().then(bootRoute);
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded', start); else start();
window.addEventListener('popstate', ()=>{ cleanup(); bootRoute(); });
})();
</script>
